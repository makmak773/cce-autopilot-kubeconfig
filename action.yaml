name: "Huawei CCE Autopilot Kubeconfig Setup"
description: "Generate kubeconfig for Huawei Cloud CCE clusters"
author: "James Mak"
branding:
  icon: "cloud"
  color: "blue"

inputs:
  project_id:
    description: "Huawei Cloud Project ID"
    required: true
  cluster_id:
    description: "CCE Cluster ID"
    required: true
  region:
    description: "Huawei Cloud region (default: ap-southeast-1)"
    required: false
    default: "ap-southeast-1"
  duration:
    description: "Cert duration in days (1–1825)"
    required: false
    default: "1"
  access_key:
    description: "Huawei Cloud Access Key"
    required: true
  secret_key:
    description: "Huawei Cloud Secret Key"
    required: true

outputs:
  kubeconfig:
    description: "Path to generated kubeconfig file"

runs:
  using: "composite"
  steps:
    - name: Configure Huawei Cloud CLI
      shell: bash
      run: |
        hcloud configure set --cli-offline=false

        /usr/bin/expect <<EOF
        set timeout 10
        spawn hcloud
        expect "Agree and continue (y)/Disagree and exit (N):"
        send "y\r"
        expect eof
        EOF
        
        hcloud configure set --access-key=${{ inputs.access_key }} --secret-key=${{ inputs.secret_key }} --region=${{ inputs.region }}

    - name: Generate cluster kubeconfig
      id: gen_config
      shell: bash
      run: |
        echo ">>> Generating cluster certificate..."
        hcloud CCE CreateAutopilotKubernetesClusterCert \
          --cli-region=${{ inputs.region }} \
          --cluster_id=${{ inputs.cluster_id }} \
          --duration=${{ inputs.duration }} > /tmp/cert.json

        echo ">>> Validating JSON..."
        cat /tmp/cert.json
        jq -e . /tmp/cert.json || { echo "Invalid JSON"; exit 1; }

        echo ">>> Extracting kubeconfig..."
        yq eval -P '.' /tmp/cert.json > /tmp/kubeconfig.yaml

        mkdir -p ~/.kube
        mv /tmp/kubeconfig.yaml ~/.kube/config
        chmod 600 ~/.kube/config

        echo "kubeconfig=$HOME/.kube/config" >> $GITHUB_OUTPUT

